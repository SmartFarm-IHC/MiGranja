<section class="screen screen--legacy onboarding">
  <p class="onboarding-label">Datos Personales</p>
  <form class="form-stack form-stack--wide" data-next="cuenta/registrar-granja">
    <div class="field field--legacy"><label for="register-name">Nombre del usuario</label><input id="register-name" name="name" placeholder="Ingrese su nombre" required></div>
    <div class="field field--legacy"><label for="register-email">Correo</label><input id="register-email" name="email" type="email" placeholder="Ingrese su correo" required></div>
    <div class="field field--legacy"><label for="register-phone">Teléfono</label><input id="register-phone" name="phone" type="tel" placeholder="Ingrese su número de teléfono" required></div>
    <div class="field field--legacy"><label for="register-password">Contraseña</label><input id="register-password" name="password" type="password" placeholder="Ingrese una contraseña" required></div>
    <div class="spacer"></div><button class="btn btn--legacy btn--full" type="submit">Siguiente</button>
  </form>
</section>
