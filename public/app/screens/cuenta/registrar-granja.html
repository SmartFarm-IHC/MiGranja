<section class="screen screen--legacy onboarding">
  <p class="onboarding-label">Datos de granja</p>
  <form class="form-stack form-stack--wide" data-next="cuenta/seleccionar-plan">
    <div class="field field--legacy"><label for="farm-name">Nombre de la granja</label><input id="farm-name" name="farm" placeholder="Ingrese el nombre de la granja" required></div>
    <div class="field field--legacy"><label for="farm-department">Departamento</label><input id="farm-department" name="department" placeholder="Ingrese el nombre del departamento" required></div>
    <div class="field field--legacy"><label for="farm-cattle">Tipo de ganado</label><input id="farm-cattle" name="cattle" placeholder="Ingrese el tipo de ganado" required></div>
    <div class="field field--legacy"><label for="farm-count">Cantidad aproximada</label><input id="farm-count" name="count" type="number" min="0" placeholder="Ingrese la cantidad de ganado"></div>
    <div class="spacer"></div><button class="btn btn--legacy btn--full" type="submit">Siguiente</button>
  </form>
</section>
