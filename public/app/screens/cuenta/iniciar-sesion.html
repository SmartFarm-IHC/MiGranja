<section class="screen screen--auth" aria-label="Iniciar sesión">
  <div class="login-logo"><img src="assets/images/brand-symbol.png" alt=""><span class="wordmark"><span>Mi</span>Granja</span></div>
  <form class="form-stack login-form" data-next="inicio/resumen">
    <div class="field field--legacy"><label for="login-email">Correo Electrónico</label><input id="login-email" type="email" name="email" placeholder="hola@gmail.com" autocomplete="email" required></div>
    <div class="field field--legacy"><label for="login-password">Contraseña</label><input id="login-password" type="password" name="password" placeholder="*********" autocomplete="current-password" required></div>
    <button class="btn btn--legacy btn--full" type="submit">Ingresar</button>
  </form>
  <div class="auth-links"><button class="text-link" type="button" data-route="cuenta/registrar-usuario">¿No tienes cuenta? Regístrate aquí.</button><button class="text-link" type="button" data-route="cuenta/recuperar-contrasena">¿Olvidaste tu contraseña?</button></div>
</section>
