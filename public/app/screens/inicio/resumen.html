<section class="screen screen--home">
  <div class="welcome">
    <div>
      <span class="eyebrow">Panel principal</span>
      <h1>Buen día, Juan!</h1>
      <p class="muted">♧ Granja San Juan</p>
      <p class="welcome-copy">Tu granja, organizada en un solo lugar.</p>
    </div>
    <img class="farm-photo" src="assets/images/farm.png" alt="Granja con ganado">
  </div>
  <h2>RESUMEN</h2>
  <div class="summary-grid">
    <button type="button" data-route="animales/listado"><strong>120</strong><span>Animales</span></button>
    <button type="button" data-route="lotes/listado"><strong>4</strong><span>Lotes</span></button>
    <button type="button" data-route="vacunacion/proximas"><strong>3</strong><span>Vacunas</span></button>
    <button type="button" data-route="inicio/alertas"><strong>2</strong><span>Alertas</span></button>
  </div>
  <h2>ACCESOS RÁPIDOS</h2>
  <div class="quick-actions">
    <button class="btn" type="button" data-route="animales/registrar">+ Animal</button>
    <button class="btn" type="button" data-route="inicio/acciones">+ Registro</button>
  </div>
</section>
